<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم مشروع العمر | إدارة المسجلين</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #c99a2b;
            --gold-deep: #a67c1e;
            --teal: #0d5559;
            --teal-dark: #083a3d;
            --teal-light: #1a7a7f;
            --cream: #fdf8f0;
            --white: #ffffff;
            --red: #c0392b;
            --green: #27ae60;
            --orange: #e67e22;
            --text: #2c2416;
            --text-light: #7a6f5f;
            --shadow: 0 4px 24px rgba(0,0,0,0.1);
            --shadow-lg: 0 12px 48px rgba(0,0,0,0.15);
            --radius: 14px;
            --radius-lg: 22px;
            --transition: 0.3s cubic-bezier(0.25, 0.8, 0.25, 1.2);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background: #faf7f0;
            color: var(--text);
            line-height: 1.7;
            min-height: 100vh;
        }
        .bg-pattern {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0; opacity: 0.03;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23c99a2b' fill-opacity='1'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/svg%3E");
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 16px; position: relative; z-index: 1; }

        .header {
            background: linear-gradient(135deg, var(--teal-dark), var(--teal), var(--teal-light));
            color: #fff; padding: 20px 28px; border-radius: var(--radius-lg);
            margin-bottom: 20px; box-shadow: var(--shadow-lg);
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 14px;
        }
        .header-title { font-size: 1.6rem; font-weight: 900; }
        .header-subtitle { font-size: 0.85rem; opacity: 0.85; }
        .header-actions { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn {
            padding: 11px 22px; border-radius: 50px; border: none;
            font-weight: 700; cursor: pointer; font-family: inherit;
            font-size: 0.9rem; transition: var(--transition);
            display: flex; align-items: center; gap: 7px;
            text-decoration: none; white-space: nowrap;
        }
        .btn-refresh { background: rgba(255,255,255,0.18); color: #fff; }
        .btn-refresh:hover { background: rgba(255,255,255,0.28); transform: translateY(-2px); }
        .btn-back { background: var(--gold); color: #1a1a1a; }
        .btn-back:hover { background: var(--gold-deep); transform: translateY(-2px); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .stats-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px; margin-bottom: 20px;
        }
        .stat-card {
            background: var(--white); border-radius: var(--radius);
            padding: 20px 24px; box-shadow: var(--shadow);
            border-right: 4px solid var(--gold);
            transition: var(--transition);
        }
        .stat-card.sent { border-right-color: var(--green); }
        .stat-card.countries { border-right-color: var(--teal); }
        .stat-card.last { border-right-color: var(--orange); }
        .stat-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
        .stat-icon { font-size: 2rem; margin-bottom: 6px; }
        .stat-value { font-size: 2.2rem; font-weight: 900; color: var(--teal-dark); line-height: 1.1; }
        .stat-label { font-size: 0.85rem; color: var(--text-light); font-weight: 600; }

        .filter-bar {
            background: var(--white); border-radius: var(--radius);
            padding: 14px 20px; margin-bottom: 18px;
            box-shadow: var(--shadow); display: flex; gap: 12px;
            flex-wrap: wrap; align-items: center;
        }
        .filter-bar input {
            flex: 1; min-width: 180px; padding: 11px 16px;
            border: 2px solid #e8e0d0; border-radius: 50px;
            font-family: inherit; font-size: 0.9rem;
            transition: var(--transition); outline: none;
        }
        .filter-bar input:focus { border-color: var(--gold); }
        .filter-badge {
            background: var(--cream); padding: 9px 16px;
            border-radius: 50px; font-weight: 700; font-size: 0.85rem;
            color: var(--teal-dark); white-space: nowrap;
        }

        .table-container {
            background: var(--white); border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg); overflow: hidden;
        }
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 850px; }
        thead th {
            background: var(--teal-dark); color: #fff;
            padding: 14px 12px; font-weight: 700; font-size: 0.85rem;
            white-space: nowrap; position: sticky; top: 0; z-index: 2;
        }
        tbody td {
            padding: 12px 10px; text-align: center; border-bottom: 1px solid #f0ebe0;
            font-size: 0.85rem; transition: var(--transition);
        }
        tbody tr { transition: var(--transition); }
        tbody tr:hover { background: #fdf8f0; }
        tbody tr.removing { animation: fadeOut 0.4s ease forwards; }
        @keyframes fadeOut {
            to { opacity: 0; transform: translateX(30px); }
        }
        .name-cell { font-weight: 700; color: var(--teal-dark); text-align: right; }
        .country-badge {
            display: inline-block; padding: 4px 10px; border-radius: 50px;
            background: var(--cream); font-size: 0.78rem; font-weight: 600;
        }
        .btn-wa {
            display: inline-flex; align-items: center; gap: 5px;
            background: #25D366; color: #fff; padding: 8px 14px;
            border-radius: 50px; text-decoration: none; font-weight: 700;
            font-size: 0.78rem; transition: var(--transition); white-space: nowrap;
        }
        .btn-wa:hover { background: #1da851; transform: scale(1.04); }
        .btn-sent {
            display: inline-flex; align-items: center; gap: 5px;
            background: var(--green); color: #fff; padding: 8px 14px;
            border-radius: 50px; border: none; cursor: pointer; font-family: inherit;
            font-weight: 700; font-size: 0.78rem; transition: var(--transition); white-space: nowrap;
        }
        .btn-sent:hover { background: #219a52; transform: scale(1.04); }
        .btn-sent:disabled { background: #aaa; cursor: not-allowed; transform: none; }
        .empty-state {
            text-align: center; padding: 50px 20px; color: var(--text-light);
        }
        .empty-state .icon { font-size: 3.5rem; margin-bottom: 10px; }
        .loading-row td { text-align: center; padding: 35px; color: var(--text-light); }
        .error-row td { text-align: center; padding: 35px; color: var(--red); }

        .toast {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            background: #1a1a1a; color: #fff; padding: 12px 24px;
            border-radius: 50px; font-weight: 700; z-index: 999;
            animation: slideUp 0.4s ease, fadeOutToast 0.4s ease 2.5s forwards;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3); font-family: inherit;
            font-size: 0.9rem;
        }
        .toast.success { background: var(--green); }
        .toast.error { background: var(--red); }
        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        @keyframes fadeOutToast {
            to { opacity: 0; transform: translateX(-50%) translateY(10px); }
        }

        @media (max-width: 768px) {
            .header { text-align: center; justify-content: center; }
            .header-title { font-size: 1.2rem; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .stat-card { padding: 14px; }
            .stat-value { font-size: 1.5rem; }
            .btn { padding: 10px 16px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>
    <div class="bg-pattern"></div>
    <div class="container">
        <header class="header">
            <div>
                <h1 class="header-title">📋 لوحة تحكم مشروع العمر</h1>
                <p class="header-subtitle">إدارة المسجلين في قائمة الانتظار</p>
            </div>
            <div class="header-actions">
                <button class="btn btn-refresh" onclick="loadDashboard()" id="refreshBtn">
                    🔄 تحديث البيانات
                </button>
                <a href="index.html" class="btn btn-back">
                    📿 صفحة التسجيل
                </a>
            </div>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">🎓</div>
                <div class="stat-value" id="statPending">--</div>
                <div class="stat-label">مسجلين بانتظار التواصل</div>
            </div>
            <div class="stat-card sent">
                <div class="stat-icon">✅</div>
                <div class="stat-value" id="statSent">--</div>
                <div class="stat-label">تم التواصل معهم</div>
            </div>
            <div class="stat-card countries">
                <div class="stat-icon">🌍</div>
                <div class="stat-value" id="statCountries">--</div>
                <div class="stat-label">دول مختلفة</div>
            </div>
            <div class="stat-card last">
                <div class="stat-icon">🕐</div>
                <div class="stat-value" id="statLast" style="font-size:0.9rem;">--</div>
                <div class="stat-label">آخر تسجيل</div>
            </div>
        </div>

        <div class="filter-bar">
            <input type="text" id="searchInput" placeholder="🔍 بحث بالاسم، البريد، الهاتف أو الدولة..." oninput="filterTable()">
            <span class="filter-badge">📊 عدد النتائج: <strong id="resultCount">--</strong></span>
        </div>

        <div class="table-container">
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>التاريخ</th>
                            <th>الاسم</th>
                            <th>البريد الإلكتروني</th>
                            <th>رقم الواتساب</th>
                            <th>الدولة</th>
                            <th>واتساب</th>
                            <th>تم الإرسال</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr class="loading-row"><td colspan="8">⏳ جاري تحميل البيانات...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // =============================================
        // ⚠️ استبدل هذا بالرابط الجديد من Apps Script
        // =============================================
        const API_URL = 'https://script.google.com/macros/s/AKfycbyzY3txfyL5ZKRg25oqY-0QokZKIAisvfDYvxmjmN8tJ_eP_9awDyeGwdTxVwZCN2J3/exec';

        let allRegistrations = [];

        // ==================== تحميل البيانات ====================
        async function loadDashboard() {
            const refreshBtn = document.getElementById('refreshBtn');
            refreshBtn.disabled = true;
            refreshBtn.textContent = '⏳ جاري التحميل...';

            try {
                // تحميل الإحصائيات
                console.log('📊 جاري تحميل الإحصائيات...');
                const statsRes = await fetch(API_URL + '?action=stats');
                const statsText = await statsRes.text();
                console.log('📊 رد الإحصائيات (نص):', statsText);
                
                let stats;
                try {
                    stats = JSON.parse(statsText);
                } catch (e) {
                    console.error('❌ فشل تحليل JSON للإحصائيات:', e);
                    throw new Error('الرد ليس JSON صحيح');
                }
                
                if (stats.success) {
                    document.getElementById('statPending').textContent = stats.pendingTotal || 0;
                    document.getElementById('statSent').textContent = stats.sentTotal || 0;
                    document.getElementById('statCountries').textContent = stats.uniqueCountries || 0;
                    if (stats.lastRegistration && stats.lastRegistration[1]) {
                        document.getElementById('statLast').textContent = 
                            stats.lastRegistration[1] + ' - ' + (stats.lastRegistration[0] || '');
                    } else {
                        document.getElementById('statLast').textContent = 'لا يوجد';
                    }
                }

                // تحميل المسجلين
                console.log('📋 جاري تحميل المسجلين...');
                const regRes = await fetch(API_URL + '?action=getAll');
                const regText = await regRes.text();
                console.log('📋 رد المسجلين (نص):', regText);
                
                let regData;
                try {
                    regData = JSON.parse(regText);
                } catch (e) {
                    console.error('❌ فشل تحليل JSON للمسجلين:', e);
                    throw new Error('الرد ليس JSON صحيح');
                }
                
                console.log('📋 بيانات المسجلين:', regData);
                
                if (regData.success) {
                    allRegistrations = regData.registrations || [];
                    console.log('✅ عدد المسجلين:', allRegistrations.length);
                    renderTable(allRegistrations);
                } else {
                    console.error('❌ فشل من الخادم:', regData.error);
                    showToast('❌ ' + (regData.error || 'فشل تحميل البيانات'), 'error');
                    document.getElementById('tableBody').innerHTML = 
                        '<tr class="error-row"><td colspan="8">❌ فشل تحميل البيانات: ' + 
                        (regData.error || 'خطأ غير معروف') + '</td></tr>';
                }
            } catch (err) {
                console.error('❌ خطأ في الاتصال:', err);
                showToast('❌ فشل الاتصال بالخادم. تأكد من الرابط والإنترنت.', 'error');
                document.getElementById('tableBody').innerHTML = 
                    '<tr class="error-row"><td colspan="8">❌ فشل الاتصال. افتح Console للمزيد من التفاصيل (F12).</td></tr>';
            } finally {
                refreshBtn.disabled = false;
                refreshBtn.textContent = '🔄 تحديث البيانات';
            }
        }

        // ==================== عرض الجدول ====================
        function renderTable(registrations) {
            const tbody = document.getElementById('tableBody');
            document.getElementById('resultCount').textContent = registrations.length;
            
            console.log('🖼️ عرض ' + registrations.length + ' مسجل في الجدول');

            if (registrations.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8"><div class="empty-state">
                    <div class="icon">📭</div>
                    <h3>لا يوجد مسجلين حالياً</h3>
                    <p>عند تسجيل متدربين جدد، سيظهرون هنا</p>
                </div></td></tr>`;
                return;
            }

            tbody.innerHTML = registrations.map((reg, index) => `
                <tr id="row-${reg.row}">
                    <td>${index + 1}</td>
                    <td>${reg.timestamp || '--'}</td>
                    <td class="name-cell">${escapeHtml(reg.name)}</td>
                    <td>${escapeHtml(reg.email)}</td>
                    <td dir="ltr">${escapeHtml(reg.phone)}</td>
                    <td><span class="country-badge">${getCountryFlag(reg.country)} ${reg.country || '--'}</span></td>
                    <td>
                        <a href="${reg.whatsappLink}" target="_blank" class="btn-wa" title="فتح المحادثة في واتساب">
                            💬 واتساب
                        </a>
                    </td>
                    <td>
                        <button class="btn-sent" onclick="markAsSent(${reg.row}, this)" title="نقل إلى قائمة تم الإرسال">
                            ✅ تم الإرسال
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        // ==================== بحث وتصفية ====================
        function filterTable() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            if (!query) {
                renderTable(allRegistrations);
                return;
            }
            const filtered = allRegistrations.filter(reg => 
                (reg.name && reg.name.toLowerCase().includes(query)) ||
                (reg.email && reg.email.toLowerCase().includes(query)) ||
                (reg.phone && reg.phone.includes(query)) ||
                (reg.country && reg.country.toLowerCase().includes(query))
            );
            renderTable(filtered);
        }

        // ==================== نقل إلى تم الإرسال ====================
        async function markAsSent(rowNumber, btnElement) {
            if (!confirm('هل أنت متأكد من نقل هذا المتدرب إلى قائمة "تم الإرسال"؟')) return;

            btnElement.disabled = true;
            btnElement.textContent = '⏳ جاري...';

            try {
                const response = await fetch(API_URL + '?action=moveToSent&row=' + rowNumber);
                const text = await response.text();
                console.log('📤 رد النقل:', text);
                const result = JSON.parse(text);

                if (result.success) {
                    const row = document.getElementById('row-' + rowNumber);
                    if (row) {
                        row.classList.add('removing');
                        setTimeout(() => {
                            row.remove();
                            updateRowNumbers();
                            document.getElementById('resultCount').textContent = 
                                document.querySelectorAll('#tableBody tr:not(.loading-row):not(.error-row):not(.empty-state)').length;
                        }, 350);
                    }
                    
                    document.getElementById('statPending').textContent = result.remainingTotal || 0;
                    document.getElementById('statSent').textContent = result.sentTotal || 0;
                    
                    showToast('✅ ' + result.message, 'success');
                } else {
                    showToast('❌ ' + (result.error || 'حدث خطأ'), 'error');
                    btnElement.disabled = false;
                    btnElement.textContent = '✅ تم الإرسال';
                }
            } catch (err) {
                console.error('❌ خطأ في النقل:', err);
                showToast('❌ فشل الاتصال بالخادم', 'error');
                btnElement.disabled = false;
                btnElement.textContent = '✅ تم الإرسال';
            }
        }

        // ==================== دوال مساعدة ====================
        function updateRowNumbers() {
            const rows = document.querySelectorAll('#tableBody tr:not(.loading-row):not(.error-row)');
            rows.forEach((row, index) => {
                const firstCell = row.querySelector('td:first-child');
                if (firstCell) firstCell.textContent = index + 1;
            });
        }

        function getCountryFlag(code) {
            const flags = {
                'SA': '🇸🇦', 'EG': '🇪🇬', 'AE': '🇦🇪', 'KW': '🇰🇼', 'QA': '🇶🇦',
                'OM': '🇴🇲', 'BH': '🇧🇭', 'JO': '🇯🇴', 'PS': '🇵🇸', 'IQ': '🇮🇶',
                'YE': '🇾🇪', 'SY': '🇸🇾', 'LB': '🇱🇧', 'LY': '🇱🇾', 'TN': '🇹🇳',
                'DZ': '🇩🇿', 'MA': '🇲🇦', 'SD': '🇸🇩', 'TR': '🇹🇷', 'ID': '🇮🇩',
                'MY': '🇲🇾', 'PK': '🇵🇰', 'IN': '🇮🇳', 'BD': '🇧🇩', 'GB': '🇬🇧',
                'US': '🇺🇸', 'CA': '🇨🇦', 'AU': '🇦🇺', 'DE': '🇩🇪', 'FR': '🇫🇷'
            };
            return flags[code] || '🌍';
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showToast(message, type = 'success') {
            const existingToast = document.querySelector('.toast');
            if (existingToast) existingToast.remove();
            
            const toast = document.createElement('div');
            toast.className = 'toast ' + type;
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => toast.remove(), 3000);
        }

        // ==================== تشغيل ====================
        loadDashboard();
        setInterval(loadDashboard, 300000); // تحديث كل 5 دقائق

        console.log('%c📋 لوحة تحكم مشروع العمر %c| %cجاهزة',
            'color: #c99a2b; font-size: 1.2rem;', '', 'color: #0d5559;');
        console.log('%c🔗 API URL:%c ' + API_URL, 'color: #666;', 'color: #999;');
        console.log('%c💡 افتح F12 لرؤية سجلات التصحيح', 'color: #888;');
    </script>
</body>
</html>
