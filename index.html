<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم مشروع العمر | إدارة المسجلين</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #c99a2b;
            --gold-deep: #a67c1e;
            --teal: #0d5559;
            --teal-dark: #083a3d;
            --teal-light: #1a7a7f;
            --cream: #fdf8f0;
            --white: #ffffff;
            --red: #c0392b;
            --green: #27ae60;
            --orange: #e67e22;
            --text: #2c2416;
            --text-light: #7a6f5f;
            --shadow: 0 4px 24px rgba(0,0,0,0.1);
            --shadow-lg: 0 12px 48px rgba(0,0,0,0.15);
            --radius: 14px;
            --radius-lg: 22px;
            --transition: 0.3s cubic-bezier(0.25, 0.8, 0.25, 1.2);
            --bg: #faf7f0;
            --card-bg: #ffffff;
            --border: #f0ebe0;
        }
        .dark-mode {
            --bg: #1a1a1a;
            --card-bg: #252525;
            --text: #e0e0e0;
            --text-light: #aaa;
            --border: #333;
            --cream: #2a2a2a;
            --shadow: 0 4px 24px rgba(0,0,0,0.4);
            --shadow-lg: 0 12px 48px rgba(0,0,0,0.5);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }
        .bg-pattern {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0; opacity: 0.03;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23c99a2b' fill-opacity='1'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/svg%3E");
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 16px; position: relative; z-index: 1; }

        .header {
            background: linear-gradient(135deg, var(--teal-dark), var(--teal), var(--teal-light));
            color: #fff; padding: 20px 28px; border-radius: var(--radius-lg);
            margin-bottom: 20px; box-shadow: var(--shadow-lg);
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 14px;
        }
        .header-title { font-size: 1.6rem; font-weight: 900; }
        .header-subtitle { font-size: 0.85rem; opacity: 0.85; }
        .header-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .btn {
            padding: 11px 22px; border-radius: 50px; border: none;
            font-weight: 700; cursor: pointer; font-family: inherit;
            font-size: 0.9rem; transition: var(--transition);
            display: flex; align-items: center; gap: 7px;
            text-decoration: none; white-space: nowrap;
        }
        .btn-refresh { background: rgba(255,255,255,0.18); color: #fff; }
        .btn-refresh:hover { background: rgba(255,255,255,0.28); transform: translateY(-2px); }
        .btn-back { background: var(--gold); color: #1a1a1a; }
        .btn-back:hover { background: var(--gold-deep); transform: translateY(-2px); }
        .btn-dark { background: rgba(255,255,255,0.18); color: #fff; font-size: 1.2rem; padding: 8px 14px; }
        .btn-dark:hover { background: rgba(255,255,255,0.3); }
        .btn-export { background: var(--orange); color: #fff; }
        .btn-export:hover { background: #d35400; transform: translateY(-2px); }
        .btn-bulk { background: var(--teal); color: #fff; }
        .btn-bulk:hover { background: var(--teal-dark); transform: translateY(-2px); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .tabs { display: flex; gap: 4px; margin-bottom: 20px; background: var(--card-bg); border-radius: var(--radius); padding: 4px; box-shadow: var(--shadow); }
        .tab-btn {
            flex: 1; padding: 12px 20px; border: none; border-radius: 12px;
            font-weight: 700; cursor: pointer; font-family: inherit; font-size: 0.9rem;
            transition: var(--transition); background: transparent; color: var(--text-light);
        }
        .tab-btn.active { background: var(--teal); color: #fff; box-shadow: var(--shadow); }
        .tab-btn .count { background: rgba(255,255,255,0.2); padding: 2px 10px; border-radius: 50px; font-size: 0.8rem; margin-right: 6px; }

        .stats-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px; margin-bottom: 20px;
        }
        .stat-card {
            background: var(--card-bg); border-radius: var(--radius);
            padding: 20px 24px; box-shadow: var(--shadow);
            border-right: 4px solid var(--gold); transition: var(--transition);
        }
        .stat-card.sent { border-right-color: var(--green); }
        .stat-card.countries { border-right-color: var(--teal); }
        .stat-card.last { border-right-color: var(--orange); }
        .stat-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
        .stat-icon { font-size: 2rem; margin-bottom: 6px; }
        .stat-value { font-size: 2.2rem; font-weight: 900; color: var(--teal-dark); line-height: 1.1; }
        .stat-label { font-size: 0.85rem; color: var(--text-light); font-weight: 600; }

        .filter-bar {
            background: var(--card-bg); border-radius: var(--radius);
            padding: 14px 20px; margin-bottom: 18px;
            box-shadow: var(--shadow); display: flex; gap: 12px;
            flex-wrap: wrap; align-items: center;
        }
        .filter-bar input {
            flex: 1; min-width: 180px; padding: 11px 16px;
            border: 2px solid #e8e0d0; border-radius: 50px;
            font-family: inherit; font-size: 0.9rem;
            transition: var(--transition); outline: none;
            background: var(--card-bg); color: var(--text);
        }
        .dark-mode .filter-bar input { border-color: #444; }
        .filter-bar input:focus { border-color: var(--gold); }
        .filter-badge {
            background: var(--cream); padding: 9px 16px;
            border-radius: 50px; font-weight: 700; font-size: 0.85rem;
            color: var(--teal-dark); white-space: nowrap;
        }
        .timer-badge {
            background: rgba(201,154,43,0.1); padding: 9px 16px;
            border-radius: 50px; font-weight: 700; font-size: 0.8rem;
            color: var(--gold-deep); white-space: nowrap;
        }

        .table-container {
            background: var(--card-bg); border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg); overflow: hidden;
        }
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 950px; }
        thead th {
            background: var(--teal-dark); color: #fff;
            padding: 14px 12px; font-weight: 700; font-size: 0.85rem;
            white-space: nowrap; position: sticky; top: 0; z-index: 2;
        }
        tbody td {
            padding: 12px 10px; text-align: center; border-bottom: 1px solid var(--border);
            font-size: 0.85rem; transition: var(--transition);
        }
        tbody tr { transition: var(--transition); }
        tbody tr:hover { background: rgba(201,154,43,0.03); }
        .dark-mode tbody tr:hover { background: rgba(255,255,255,0.02); }
        tbody tr.removing { animation: fadeOut 0.4s ease forwards; }
        @keyframes fadeOut { to { opacity: 0; transform: translateX(30px); } }
        .name-cell { font-weight: 700; color: var(--teal-dark); text-align: right; cursor: pointer; }
        .name-cell:hover { color: var(--gold); }
        .country-badge {
            display: inline-block; padding: 4px 10px; border-radius: 50px;
            background: var(--cream); font-size: 0.78rem; font-weight: 600;
        }
        .phone-cell { cursor: pointer; position: relative; }
        .phone-cell:hover { color: var(--teal); }
        .copy-tooltip {
            position: absolute; top: -30px; left: 50%; transform: translateX(-50%);
            background: #1a1a1a; color: #fff; padding: 4px 12px; border-radius: 50px;
            font-size: 0.7rem; white-space: nowrap; opacity: 0; pointer-events: none;
            transition: opacity 0.2s;
        }
        .phone-cell:hover .copy-tooltip { opacity: 1; }
        .btn-wa {
            display: inline-flex; align-items: center; gap: 5px;
            background: #25D366; color: #fff; padding: 8px 14px;
            border-radius: 50px; text-decoration: none; font-weight: 700;
            font-size: 0.78rem; transition: var(--transition); white-space: nowrap;
        }
        .btn-wa:hover { background: #1da851; transform: scale(1.04); }
        .btn-sent {
            display: inline-flex; align-items: center; gap: 5px;
            background: var(--green); color: #fff; padding: 8px 14px;
            border-radius: 50px; border: none; cursor: pointer; font-family: inherit;
            font-weight: 700; font-size: 0.78rem; transition: var(--transition); white-space: nowrap;
        }
        .btn-sent:hover { background: #219a52; transform: scale(1.04); }
        .btn-sent:disabled { background: #aaa; cursor: not-allowed; transform: none; }
        .empty-state { text-align: center; padding: 50px 20px; color: var(--text-light); }
        .empty-state .icon { font-size: 3.5rem; margin-bottom: 10px; }

        .toast {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            background: #1a1a1a; color: #fff; padding: 12px 24px;
            border-radius: 50px; font-weight: 700; z-index: 999;
            animation: slideUp 0.4s ease, fadeOutToast 0.4s ease 2.5s forwards;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3); font-family: inherit;
            font-size: 0.9rem;
        }
        .toast.success { background: var(--green); }
        .toast.error { background: var(--red); }
        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        @keyframes fadeOutToast {
            to { opacity: 0; transform: translateX(-50%) translateY(10px); }
        }

        /* Chart bar simple */
        .chart-bar {
            display: flex; align-items: end; gap: 4px; height: 80px;
            margin: 10px 0; padding: 0 10px;
        }
        .chart-bar .bar {
            flex: 1; background: var(--teal); border-radius: 6px 6px 0 0;
            transition: height 0.5s ease; min-width: 20px;
            position: relative;
        }
        .chart-bar .bar .bar-label {
            position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%);
            font-size: 0.6rem; color: var(--text-light); white-space: nowrap;
        }

        @media (max-width: 768px) {
            .header { text-align: center; justify-content: center; }
            .header-title { font-size: 1.2rem; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .stat-card { padding: 14px; }
            .stat-value { font-size: 1.5rem; }
            .btn { padding: 10px 16px; font-size: 0.8rem; }
            .tabs { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="bg-pattern"></div>
    <div class="container">
        <header class="header">
            <div>
                <h1 class="header-title">📋 لوحة تحكم مشروع العمر</h1>
                <p class="header-subtitle">إدارة المسجلين في قائمة الانتظار</p>
            </div>
            <div class="header-actions">
                <button class="btn btn-dark" onclick="toggleDarkMode()" title="تبديل الوضع الليلي">🌓</button>
                <button class="btn btn-export" onclick="exportToExcel()">📥 تصدير Excel</button>
                <button class="btn btn-bulk" onclick="bulkMoveAll()">📦 نقل الكل</button>
                <button class="btn btn-refresh" onclick="loadDashboard()" id="refreshBtn">🔄 تحديث</button>
                <a href="index.html" class="btn btn-back">📿 التسجيل</a>
            </div>
        </header>

        <!-- تبويبات -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('pending')">
                🎓 قيد الانتظار <span class="count" id="pendingCount">0</span>
            </button>
            <button class="tab-btn" onclick="switchTab('sent')">
                ✅ تم الإرسال <span class="count" id="sentCount">0</span>
            </button>
        </div>

        <div class="stats-grid">
            <div class="stat-card"><div class="stat-icon">🎓</div><div class="stat-value" id="statPending">--</div><div class="stat-label">مسجلين بانتظار التواصل</div></div>
            <div class="stat-card sent"><div class="stat-icon">✅</div><div class="stat-value" id="statSent">--</div><div class="stat-label">تم التواصل معهم</div></div>
            <div class="stat-card countries"><div class="stat-icon">🌍</div><div class="stat-value" id="statCountries">--</div><div class="stat-label">دول مختلفة</div></div>
            <div class="stat-card last"><div class="stat-icon">🕐</div><div class="stat-value" id="statLast" style="font-size:0.9rem;">--</div><div class="stat-label">آخر تسجيل</div></div>
        </div>

        <div class="filter-bar">
            <input type="text" id="searchInput" placeholder="🔍 بحث بالاسم، البريد، الهاتف أو الدولة..." oninput="filterTable()">
            <span class="filter-badge">📊 النتائج: <strong id="resultCount">--</strong></span>
            <span class="timer-badge">⏱ تحديث بعد: <strong id="countdown">5:00</strong></span>
        </div>

        <div class="table-container">
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th><input type="checkbox" id="selectAll" onchange="toggleSelectAll()" title="تحديد الكل"></th>
                            <th>#</th>
                            <th>التاريخ</th>
                            <th>الاسم</th>
                            <th>البريد الإلكتروني</th>
                            <th>رقم الواتساب</th>
                            <th>الدولة</th>
                            <th>واتساب</th>
                            <th>تم الإرسال</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr><td colspan="9" style="text-align:center;padding:35px;">⏳ جاري تحميل البيانات...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbyzY3txfyL5ZKRg25oqY-0QokZKIAisvfDYvxmjmN8tJ_eP_9awDyeGwdTxVwZCN2J3/exec';
        let allRegistrations = [];
        let sentRegistrations = [];
        let currentTab = 'pending';
        let countdownSeconds = 300;
        let previousTotal = 0;

        // ==================== الوضع الداكن ====================
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
        }
        if (localStorage.getItem('darkMode') === 'true') document.body.classList.add('dark-mode');

        // ==================== التبويبات ====================
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`.tab-btn:${tab === 'pending' ? 'first' : 'last'}-child`).classList.add('active');
            if (tab === 'pending') renderTable(allRegistrations);
            else renderSentTable(sentRegistrations);
            document.getElementById('resultCount').textContent = tab === 'pending' ? allRegistrations.length : sentRegistrations.length;
            document.getElementById('selectAll').checked = false;
        }

        // ==================== تحميل البيانات ====================
        async function loadDashboard() {
            const refreshBtn = document.getElementById('refreshBtn');
            refreshBtn.disabled = true;
            refreshBtn.textContent = '⏳ جاري...';
            countdownSeconds = 300;

            try {
                const [statsRes, regRes, sentRes] = await Promise.all([
                    fetch(API_URL + '?action=stats'),
                    fetch(API_URL + '?action=getAll'),
                    fetch(API_URL + '?action=getSent')
                ]);

                const stats = await statsRes.json();
                const regData = await regRes.json();
                const sentData = await sentRes.json();

                if (stats.success) {
                    document.getElementById('statPending').textContent = stats.pendingTotal || 0;
                    document.getElementById('statSent').textContent = stats.sentTotal || 0;
                    document.getElementById('statCountries').textContent = stats.uniqueCountries || 0;
                    document.getElementById('pendingCount').textContent = stats.pendingTotal || 0;
                    document.getElementById('sentCount').textContent = stats.sentTotal || 0;
                    if (stats.lastRegistration && stats.lastRegistration[1]) {
                        document.getElementById('statLast').textContent = stats.lastRegistration[1] + ' - ' + (stats.lastRegistration[0] || '');
                    }
                }

                if (regData.success) {
                    allRegistrations = regData.registrations || [];
                    if (allRegistrations.length > previousTotal) {
                        playNotificationSound();
                    }
                    previousTotal = allRegistrations.length;
                    if (currentTab === 'pending') renderTable(allRegistrations);
                }

                if (sentData.success) {
                    sentRegistrations = sentData.registrations || [];
                    if (currentTab === 'sent') renderSentTable(sentRegistrations);
                }

            } catch (err) {
                console.error('خطأ:', err);
            } finally {
                refreshBtn.disabled = false;
                refreshBtn.textContent = '🔄 تحديث';
            }
        }

        // ==================== عرض الجداول ====================
        function renderTable(registrations) {
            const tbody = document.getElementById('tableBody');
            document.getElementById('resultCount').textContent = registrations.length;
            if (registrations.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9"><div class="empty-state"><div class="icon">📭</div><h3>لا يوجد مسجلين</h3></div></td></tr>`;
                return;
            }
            tbody.innerHTML = registrations.map((reg, i) => `
                <tr id="row-${reg.row}">
                    <td><input type="checkbox" class="row-check" data-row="${reg.row}" ${reg.selected ? 'checked' : ''}></td>
                    <td>${i + 1}</td>
                    <td>${reg.timestamp || '--'}</td>
                    <td class="name-cell" title="انقر لنسخ الاسم" onclick="copyText('${escapeHtml(reg.name)}')">${escapeHtml(reg.name)}</td>
                    <td>${escapeHtml(reg.email)}</td>
                    <td class="phone-cell" onclick="copyText('${escapeHtml(reg.phone)}')" dir="ltr">
                        ${escapeHtml(reg.phone)}
                        <span class="copy-tooltip">📋 نسخ</span>
                    </td>
                    <td><span class="country-badge">${getCountryFlag(reg.country)} ${reg.country || '--'}</span></td>
                    <td><a href="${reg.whatsappLink}" target="_blank" class="btn-wa">💬 واتساب</a></td>
                    <td><button class="btn-sent" onclick="markAsSent(${reg.row}, this)">✅ إرسال</button></td>
                </tr>
            `).join('');
        }

        function renderSentTable(registrations) {
            const tbody = document.getElementById('tableBody');
            document.getElementById('resultCount').textContent = registrations.length;
            if (registrations.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9"><div class="empty-state"><div class="icon">✅</div><h3>لا يوجد مرسل لهم بعد</h3></div></td></tr>`;
                return;
            }
            tbody.innerHTML = registrations.map((reg, i) => `
                <tr>
                    <td>--</td>
                    <td>${i + 1}</td>
                    <td>${reg.timestamp || '--'}</td>
                    <td class="name-cell">${escapeHtml(reg.name)}</td>
                    <td>${escapeHtml(reg.email)}</td>
                    <td dir="ltr">${escapeHtml(reg.phone)}</td>
                    <td><span class="country-badge">${getCountryFlag(reg.country)} ${reg.country || '--'}</span></td>
                    <td><a href="${reg.whatsappLink}" target="_blank" class="btn-wa">💬 واتساب</a></td>
                    <td><span style="color:var(--green);font-weight:700;">✅ تم</span></td>
                </tr>
            `).join('');
        }

        // ==================== تحديد الكل ====================
        function toggleSelectAll() {
            const checked = document.getElementById('selectAll').checked;
            document.querySelectorAll('.row-check').forEach(cb => cb.checked = checked);
        }

        function getSelectedRows() {
            return Array.from(document.querySelectorAll('.row-check:checked')).map(cb => parseInt(cb.dataset.row));
        }

        // ==================== تصدير Excel ====================
        function exportToExcel() {
            const data = currentTab === 'pending' ? allRegistrations : sentRegistrations;
            if (data.length === 0) return showToast('⚠️ لا توجد بيانات للتصدير', 'error');
            let csv = 'الاسم,البريد,الهاتف,الدولة,التاريخ\n';
            data.forEach(r => csv += `"${r.name}","${r.email}","${r.phone}","${r.country}","${r.timestamp}"\n`);
            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'مشروع_العمر_' + new Date().toISOString().slice(0,10) + '.csv';
            a.click(); URL.revokeObjectURL(url);
            showToast('✅ تم التصدير بنجاح', 'success');
        }

        // ==================== نقل جماعي ====================
        async function bulkMoveAll() {
            const selected = getSelectedRows();
            if (selected.length === 0) return showToast('⚠️ حدد صفوفاً أولاً أو استخدم "نقل الكل" بحذر', 'error');
            if (!confirm(`نقل ${selected.length} متدرب إلى "تم الإرسال"؟`)) return;
            for (const row of selected) {
                try { await fetch(API_URL + '?action=moveToSent&row=' + row); } catch(e) {}
            }
            showToast(`✅ تم نقل ${selected.length} متدرب`, 'success');
            loadDashboard();
        }

        // ==================== نسخ النص ====================
        function copyText(text) {
            navigator.clipboard.writeText(text).then(() => showToast('📋 تم النسخ: ' + text, 'success'));
        }

        // ==================== إشعار صوتي ====================
        function playNotificationSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                osc.type = 'sine'; osc.frequency.value = 800;
                osc.connect(ctx.destination); osc.start();
                setTimeout(() => osc.stop(), 200);
            } catch(e) {}
        }

        // ==================== دوال مساعدة ====================
        function filterTable() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const data = currentTab === 'pending' ? allRegistrations : sentRegistrations;
            renderTable(query ? data.filter(r => (r.name&&r.name.toLowerCase().includes(query))||(r.email&&r.email.toLowerCase().includes(query))||(r.phone&&r.phone.includes(query))||(r.country&&r.country.toLowerCase().includes(query))) : data);
        }

        async function markAsSent(rowNumber, btnElement) {
            if (!confirm('نقل هذا المتدرب إلى "تم الإرسال"؟')) return;
            btnElement.disabled = true; btnElement.textContent = '⏳';
            try {
                const res = await fetch(API_URL + '?action=moveToSent&row=' + rowNumber);
                const result = await res.json();
                if (result.success) {
                    document.getElementById('row-'+rowNumber)?.classList.add('removing');
                    setTimeout(() => { loadDashboard(); }, 400);
                    showToast('✅ ' + result.message, 'success');
                } else {
                    showToast('❌ ' + (result.error||'خطأ'), 'error');
                    btnElement.disabled = false; btnElement.textContent = '✅ إرسال';
                }
            } catch(e) {
                showToast('❌ فشل الاتصال', 'error');
                btnElement.disabled = false; btnElement.textContent = '✅ إرسال';
            }
        }

        function getCountryFlag(c) {
            const f={'SA':'🇸🇦','EG':'🇪🇬','AE':'🇦🇪','KW':'🇰🇼','QA':'🇶🇦','OM':'🇴🇲','JO':'🇯🇴','PS':'🇵🇸','IQ':'🇮🇶','YE':'🇾🇪','SY':'🇸🇾','LB':'🇱🇧','LY':'🇱🇾','TN':'🇹🇳','DZ':'🇩🇿','MA':'🇲🇦','SD':'🇸🇩','TR':'🇹🇷','ID':'🇮🇩','MY':'🇲🇾','PK':'🇵🇰','IN':'🇮🇳','GB':'🇬🇧','US':'🇺🇸','CA':'🇨🇦','AU':'🇦🇺','DE':'🇩🇪','FR':'🇫🇷'};
            return f[c]||'🌍';
        }
        function escapeHtml(t) { if(!t)return''; const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }
        function showToast(m, type='success') {
            const existing=document.querySelector('.toast'); if(existing)existing.remove();
            const t=document.createElement('div'); t.className='toast '+type; t.textContent=m;
            document.body.appendChild(t); setTimeout(()=>t.remove(),3000);
        }

        // ==================== عداد تنازلي ====================
        setInterval(() => {
            countdownSeconds--;
            if (countdownSeconds <= 0) { loadDashboard(); countdownSeconds = 300; }
            const m = Math.floor(countdownSeconds/60);
            const s = countdownSeconds%60;
            document.getElementById('countdown').textContent = m+':'+(s<10?'0':'')+s;
        }, 1000);

        // ==================== بدء ====================
        loadDashboard();

        console.log('%c🌟 مشروع العمر %c| %cلوحة تحكم احترافية v2.0', 'color:#c99a2b;font-size:1.2rem;','','color:#0d5559;');
        console.log('%c✨ إضافات: تصدير Excel | نسخ بنقرة | نقل جماعي | وضع داكن | إشعار صوتي', 'color:#888;');
    </script>
</body>
